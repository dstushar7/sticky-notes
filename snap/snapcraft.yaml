name: stickynotes-dabobroto
title: Sticky Notes
base: core24
version: '4.0.1'
platforms:
  amd64:
summary: The lightest, prettiest sticky notes app on Linux. No cloud, no nonsense.
icon: snap/gui/stickynotes.png
description: |
  Sticky notes. That's it. That's the app.

  No cloud. No account. No "AI note assistant." No spatial canvas you have to
  pan around just to find your grocery list. Just outrageously pretty notes
  that stick to your desktop and then get out of your way.

  Oh, and the whole thing is about 28 MB — while the competition ships half
  an operating system just to show you a yellow square.

  Nice to look at
  - Frameless and rounded with soft drop shadows — it belongs on a desktop in
    2026, not a 2006 panel
  - Seven hand-picked colours: yellow, green, pink, purple, blue, gray, and a
    charcoal dark mode
  - Calm by default: the formatting toolbar only shows on the note you're
    typing in. The rest just tell you when they were last edited
  - See-through notes: fade a note's paper down to 50% to see what's behind
    it. The text stays solid, and the note turns solid while you use it
  - Collapse any note to a tidy bar with a double-click. Checklists still
    show what's left (1/4) while folded away

  Nice to use
  - Rich text: bold, italic, underline, strikethrough, bullet lists, and real
    checklists you tick with a click
  - Lists that keep themselves going: type "1." or "-" and Enter starts the
    next item. Numbers fix themselves when you add, remove or nest items
  - Keep on top: pin a note above every other window
  - All notes: one window to search every note and filter by colour
  - Share a note as a short bit of text — paste it in any chat and your
    colleague adds it with one click, after a preview. Still no account,
    still no cloud
  - Real keyboard shortcuts: Ctrl+N, Ctrl+B/I/U, Ctrl+Shift+S/L/K, Tab to indent
  - Notes name themselves from your first line until you decide otherwise
  - Drag them anywhere, resize from any edge, open as many as you like
  - Lives in the system tray with your recent notes a click away, and can keep
    your notes off the dock entirely if you prefer
  - Auto-launches at login by default — quietly restores your notes,
    skips the popup if you have nothing saved, and flips off in Settings
    if you don't want it (no blank window in your face every morning)
  - A two-click delete, plus Undo, so you never lose a note by flinching

  What it deliberately does NOT do
  - Sync to a cloud you never asked for
  - Make you create an account to write the word "milk"
  - Phone home, track you, or ship a single line of telemetry
  - Pretend to be a wiki, a knowledge base, or your second brain

  Where your notes live
  On your machine, in a plain local config file. No servers, no encryption
  ceremony, no "vault" to unlock — it's a sticky note, not a Swiss bank.

  Works on Ubuntu, KDE Plasma, XFCE and other Linux desktops, on X11 and
  Wayland. On plain GNOME without a tray (Fedora, for example), add the
  "AppIndicator and KStatusNotifierItem Support" extension for the tray icon.

  Free, tiny, and it does one thing properly.

grade: stable
confinement: strict

license: MIT
contact: contact@dabobrotosarkar.com
website: https://dabobrotosarkar.com/
donation: https://www.patreon.com/dstushar7/posts/sticky-note-164511062
source-code: https://github.com/dstushar7/sticky-notes
issues: https://github.com/dstushar7/sticky-notes/issues

apps:
  stickynotes:
    command: bin/python3 $SNAP/run_stickynotes.py
    extensions: [gnome]
    desktop: gui/stickynotes.desktop
    # Lets snapd sync the app's autostart entry to the host.
    autostart: stickynotes.desktop
    plugs: [home]
    environment:
      # xcb (XWayland on Wayland) so note positions persist; wayland is only a fallback.
      QT_QPA_PLATFORM: xcb;wayland

parts:
  stickynotes:
    plugin: python
    source: .
    python-packages:
      - PyQt6
      - PyQt6-Qt6
      - PyQt6_sip
      - python-xlib
    stage-packages:
      - libxcb-cursor0
    override-build: |
      craftctl default
      cp -r $CRAFT_PROJECT_DIR/stickynotes $CRAFT_PART_INSTALL/
      cp $CRAFT_PROJECT_DIR/run_stickynotes.py $CRAFT_PART_INSTALL/
    override-prime: |
      craftctl default
      # Copy GUI assets
      cp -r $CRAFT_PROJECT_DIR/snap/gui $CRAFT_PRIME/

      # Drop pip/setuptools/wheel — not needed at runtime
      rm -rf $CRAFT_PRIME/lib/python*/site-packages/pip*
      rm -rf $CRAFT_PRIME/lib/python*/site-packages/setuptools*
      rm -rf $CRAFT_PRIME/lib/python*/site-packages/wheel*
      rm -rf $CRAFT_PRIME/lib/python*/site-packages/_distutils_hack

      # Prune unused PyQt6 modules — sticky-notes only needs QtCore/QtGui/QtWidgets
      PYQT6="$CRAFT_PRIME/lib/python3.12/site-packages/PyQt6"
      QT6LIB="$PYQT6/Qt6/lib"
      QT6PLUG="$PYQT6/Qt6/plugins"

      # Remove PyQt6 Python bindings we don't use
      for mod in QtQuick QtQml QtOpenGL QtNetwork QtMultimedia QtMultimediaWidgets \
                 QtBluetooth QtSql QtDesigner QtTest QtPdf QtPdfWidgets QtPrintSupport \
                 QtPositioning QtSensors QtSerialPort QtWebChannel QtWebSockets \
                 QtXml QtSvg QtSvgWidgets QtQuick3D QtQuickWidgets QtRemoteObjects \
                 QtNfc QtDBus QtHelp QtCharts QtDataVisualization QtSpatialAudio \
                 QtTextToSpeech Qt3DCore Qt3DRender Qt3DInput Qt3DLogic Qt3DAnimation \
                 Qt3DExtras QtQuickControls2; do
        rm -f "$PYQT6/${mod}.abi3.so"
      done

      # Keep only the Qt libraries the app loads (the Wayland ones serve the fallback plugin).
      find "$QT6LIB" -maxdepth 1 -name 'libQt6*.so*' \
        ! -name 'libQt6Core.so*' \
        ! -name 'libQt6Gui.so*' \
        ! -name 'libQt6Widgets.so*' \
        ! -name 'libQt6DBus.so*' \
        ! -name 'libQt6XcbQpa.so*' \
        ! -name 'libQt6OpenGL.so*' \
        ! -name 'libQt6WaylandClient.so*' \
        ! -name 'libQt6WaylandEglClientHwIntegration.so*' \
        -delete

      # Drop QML, translations, Quick3D/Multimedia-only assets, and libavcodec (15 MB)
      rm -rf "$PYQT6/Qt6/qml"
      rm -rf "$PYQT6/Qt6/translations"
      rm -rf "$PYQT6/Qt6/resources"
      rm -f  "$QT6LIB"/libav*.so* "$QT6LIB"/libsw*.so*

      # Prune plugin folders we don't use (keep platforms, styles, imageformats, etc.)
      if [ -d "$QT6PLUG" ]; then
        find "$QT6PLUG" -mindepth 1 -maxdepth 1 -type d \
          ! -name 'platforms' \
          ! -name 'platforminputcontexts' \
          ! -name 'platformthemes' \
          ! -name 'styles' \
          ! -name 'imageformats' \
          ! -name 'iconengines' \
          ! -name 'xcbglintegrations' \
          ! -name 'wayland-*' \
          -exec rm -rf {} +
      fi

      # Drop PyQt6 dev bindings (.pyi/.sip) and uic (Designer tool)
      rm -rf "$PYQT6/bindings"
      rm -rf "$PYQT6/uic"
