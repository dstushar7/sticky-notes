name: Publish Snap to Store

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: snap-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build the Snap package
        id: build
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: 8.x/stable

      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the Snap to the Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
