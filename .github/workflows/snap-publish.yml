name: Publish Snap to Store

# edge branch push      -> edge channel   (testers: snap install --edge)
# GitHub release        -> stable channel (everyone)
# main is not published on its own: it ships to stable through a release.
on:
  push:
    branches: [edge]
  release:
    types: [published]

concurrency:
  group: snap-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build the Snap package
        id: build
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: 8.x/stable

      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/edge" ]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "Refusing to publish from ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Publish the Snap to the Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
